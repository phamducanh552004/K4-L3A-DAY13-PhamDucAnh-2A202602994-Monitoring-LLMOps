alerts:
  - name: api_latency_p95_slo_breach
    severity: warning
    condition: response_sent latency_ms p95 > 3000
    duration: 10m
    type: symptom-based
    channel: slack
    owner: Pham Duc Anh
    runbook: docs/alerts.md#alert-1
  - name: api_error_rate_high
    severity: critical
    condition: request_failed / request_received * 100 > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: Pham Duc Anh
    runbook: docs/alerts.md#alert-2
  - name: retrieval_success_rate_low
    severity: warning
    condition: retrieval tool_success rate < 90
    duration: 10m
    type: symptom-based
    channel: slack
    owner: Pham Duc Anh
    runbook: docs/alerts.md#alert-3
